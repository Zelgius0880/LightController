openapi: 3.0.0
info:
  title: LightController ESP32 API
  version: 1.0.0
  description: API for managing Philips Hue lights, Netatmo sensors, and system status on an ESP32 device.

servers:
  - url: http://{esp32_ip}
    description: The ESP32 device's local IP address
    variables:
      esp32_ip:
        default: 192.168.1.100
        description: The IP address of your ESP32 device

paths:
  /status:
    get:
      summary: Get System Status
      description: Returns the current system status, memory usage, and Netatmo token information.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logs:
    get:
      summary: Get System Logs
      description: Returns recent system log messages.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["Log message 1", "Log message 2"]
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /groups:
    get:
      summary: Get All Groups
      description: Returns a list of all light groups from the local database.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      summary: Create or Update a Light Group
      description: Creates a new light group or updates an existing one in the local database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '200':
          description: Group upserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to upsert group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a Light Group
      description: Deletes a light group and its associated switches and group-light associations.
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: The ID of the group to delete.
      responses:
        '200':
          description: Group deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Missing id parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lights:
    get:
      summary: Get Lights by Group ID
      description: Returns a list of lights associated with the specified group ID.
      parameters:
        - in: query
          name: groupId
          required: true
          schema:
            type: integer
            format: int64
          description: The ID of the group to retrieve lights for.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Light'
        '400':
          description: Missing groupId parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create or Update a Light
      description: Creates a new light or updates an existing one and associates it with a group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Light'
      responses:
        '200':
          description: Light upserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to upsert light
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a Light from a Group
      description: Removes a light from a specific group. If the light is no longer referenced by any group, it is removed from the lights table.
      parameters:
        - in: query
          name: uid
          required: true
          schema:
            type: string
          description: The UID of the light to delete.
        - in: query
          name: groupId
          required: true
          schema:
            type: integer
            format: int64
          description: The ID of the group to remove the light from.
      responses:
        '200':
          description: Light removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Missing uid or groupId parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete light
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /switches:
    get:
      summary: Get Switches by Group ID
      description: Returns a list of switches associated with the specified group ID.
      parameters:
        - in: query
          name: groupId
          required: true
          schema:
            type: integer
            format: int64
          description: The ID of the group to retrieve switches for.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Switch'
        '400':
          description: Missing groupId parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create or Update a Switch
      description: Creates a new switch or updates an existing one and associates it with a group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Switch'
      responses:
        '200':
          description: Switch upserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to upsert switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a Switch
      description: Deletes a switch from the local database.
      parameters:
        - in: query
          name: uid
          required: true
          schema:
            type: string
          description: The UID of the switch to delete.
      responses:
        '200':
          description: Switch deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Missing uid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /switches/check:
    get:
      summary: Check if a Switch Exists
      description: Checks if a switch with the specified UID already exists and returns its details if it does.
      parameters:
        - in: query
          name: uid
          required: true
          schema:
            type: string
          description: The UID of the switch to check.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                  uid:
                    type: string
                  name:
                    type: string
                  groupId:
                    type: integer
                    format: int64
        '400':
          description: Missing uid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /switch_attribution/mode:
    post:
      summary: Toggle Switch Attribution Mode
      description: Enables or disables switch attribution mode. When enabled, 433MHz signals are captured for mapping instead of triggering light events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether to enable attribution mode.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /switch_attribution/data:
    get:
      summary: Get Last Received Switch Data
      description: Returns the UID of the last 433MHz signal received while in attribution mode.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether attribution mode is currently enabled.
                  last_data:
                    type: string
                    nullable: true
                    description: The UID of the last received signal as a hex string (12 chars).

  /render:
    get:
      summary: Trigger Image Rendering
      description: Triggers the ESP32 to render a new image on its display based on current data.
      responses:
        '200':
          description: Image rendering initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          description: Failed to create semaphore
          content:
            text/plain:
              schema:
                type: string
                example: Failed to create semaphore
        '503':
          description: Rendering queue full
          content:
            text/plain:
              schema:
                type: string
                example: Rendering Queue Full
        '504':
          description: Render timeout
          content:
            text/plain:
              schema:
                type: string
                example: Render Timeout

  /export_db:
    get:
      summary: Export Database
      description: Downloads the current SQLite database file from the ESP32.
      responses:
        '200':
          description: Database file downloaded successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: Failed to read database file

  /import_db:
    post:
      summary: Import Database
      description: Uploads and replaces the local SQLite database file on the ESP32.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Database imported successfully
          content:
            text/plain:
              schema:
                type: string
                example: Import successful
        '500':
          description: Failed to import database
          content:
            text/plain:
              schema:
                type: string
                example: Failed to import database

  /crashes:
    get:
      summary: Download Core Dump
      description: Downloads the core dump file if the ESP32 has crashed.
      responses:
        '200':
          description: Core dump file downloaded successfully or no core dump found
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                example: No core dump
        '500':
          description: Failed to read core dump
          content:
            text/plain:
              schema:
                type: string
                example: Failed to read core dump

  /clear_crashes:
    get:
      summary: Clear Core Dump
      description: Erases the stored core dump from the ESP32's flash memory.
      responses:
        '200':
          description: Core dump erased successfully
          content:
            text/plain:
              schema:
                type: string
                example: Core dump erased
        '500':
          description: Failed to erase core dump
          content:
            text/plain:
              schema:
                type: string
                example: Failed to erase core dump

  /token_result:
    get:
      summary: Netatmo Token Callback
      description: Callback endpoint for Netatmo OAuth, receives the authorization code. This endpoint should only be called as the callback of the Netatmo OAuth flow.
      parameters:
        - in: query
          name: code
          schema:
            type: string
          required: true
          description: The authorization code from Netatmo.
      responses:
        '200':
          description: Token negotiation started
          content:
            text/plain:
              schema:
                type: string
                example: Token negotiation started. You can close this tab.
        '400':
          description: Missing code parameter
          content:
            text/plain:
              schema:
                type: string
                example: Missing code parameter
        '500':
          description: Failed to send event to rendering task
          content:
            text/plain:
              schema:
                type: string
                example: Failed to send event to rendering task

  /upload_image:
    post:
      summary: Upload Image
      description: Uploads an image file to the ESP32.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          description: Failed to upload image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: Preflight request for Upload Image
      responses:
        '204':
          description: No Content (Successful preflight)

components:
  schemas:
    Group:
      type: object
      required:
        - id
        - name
        - brightness
        - x
        - y
        - mirek
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the group.
          example: 1
        name:
          type: string
          description: Name of the group.
          example: Living Room
        brightness:
          type: number
          format: float
          description: Default brightness for the group (0.0 to 1.0).
          example: 0.8
        x:
          type: number
          format: float
          description: X-coordinate for the group's position.
          example: 0.5
        y:
          type: number
          format: float
          description: Y-coordinate for the group's position.
          example: 0.5
        mirek:
          type: integer
          description: Color temperature in mireks.
          example: 300

    Light:
      type: object
      required:
        - uid
        - name
        - state
        - type
        - brightness
        - x
        - y
        - mirek
        - groupId
      properties:
        uid:
          type: string
          description: Unique identifier for the light (e.g., Hue light ID).
          example: "00:17:88:01:04:00:00:01-0b"
        name:
          type: string
          description: Name of the light.
          example: Ceiling Light
        state:
          type: string
          description: Current state of the light (e.g., "ON", "OFF").
          example: "ON"
        type:
          type: string
          description: Type of light (e.g., "Extended color light").
          example: "Extended color light"
        brightness:
          type: number
          format: float
          description: Brightness of the light (0.0 to 1.0).
          example: 0.7
        x:
          type: number
          format: float
          description: X-coordinate for the light's position.
          example: 0.3
        y:
          type: number
          format: float
          description: Y-coordinate for the light's position.
          example: 0.7
        groupId:
          type: integer
          format: int64
          description: ID of the group this light belongs to.
          example: 1
        mirek:
          type: integer
          description: Color temperature in mireks.
          example: 300

    Switch:
      type: object
      required:
        - uid
        - name
        - groupId
      properties:
        uid:
          type: string
          description: Unique identifier for the switch (e.g., 433MHz code).
          example: "0x123456"
        name:
          type: string
          description: Name of the switch.
          example: Wall Switch 1
        groupId:
          type: integer
          format: int64
          description: ID of the group this switch controls.
          example: 1

    StatusResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          description: Indicates if Hue Bridge is authenticated.
        username:
          type: string
          description: Hue Bridge username.
        error:
          type: string
          description: Last error message, if any.
        totalBytes:
          type: integer
          description: Total PSRAM bytes.
        usedBytes:
          type: integer
          description: Used PSRAM bytes.
        netatmo:
          type: object
          properties:
            authenticated:
              type: boolean
            expires_in:
              type: integer
            creation_timestamp:
              type: integer
            valid:
              type: boolean
        fsTotal:
          type: integer
          description: Total LittleFS bytes.
        fsUsed:
          type: integer
          description: Used LittleFS bytes.
        firmware:
          type: string
          description: Firmware version.
        heapTotal:
          type: integer
          description: Total heap memory.
        heapFree:
          type: integer
          description: Free heap memory.

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A descriptive error message.
          example: Invalid JSON