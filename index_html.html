<!DOCTYPE html>
<html lang="en">
<title>Light controller</title>
<head>
    <meta charset="UTF-8">
    <title>Light controller</title>

    <script>
        function getLocalIp() {
            return  "%LOCAL_IP%";
        }

        function getNetatmoClientId() {
            return "%NETATMO_CLIENT_ID%";
        }
    </script>

    <!-- 1. Load the Compose canvas helper script from the CDN -->
    <script src="https://cdn.statically.io/gh/Zelgius0880/LightController@6b0812e9/static/composeApp.js" charset="UTF-8"></script>
    <link type="text/css" rel="stylesheet" href="https://cdn.statically.io/gh/Zelgius0880/LightController@6b0812e9/static/styles.css">

</head>
<body>
<canvas id="ComposeTarget"></canvas>

<script>
    // 2. Configure Compose to fetch the .wasm file from the CDN
    // By default, it looks for it in the same directory, so we override it.


    window.addEventListener('DOMContentLoaded', () => {

        // Check if the initialization function exists from the CDN script
        if (typeof composeApp !== 'undefined' && composeApp.main) {
            // If your build setup uses the standard Kotlin/Wasm instantiation,
            // ensure any relative paths point to the CDN.
            // Note: Some setups require passing the baseUrl to the main function if you load resources.
            composeApp.main();
        }
    });
</script>
</body>
</html>
