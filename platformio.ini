; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
extra_scripts = post:suppress_lib_warnings.py
build_flags = 
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-Iinclude
	-DFIRWARE_VERSION="0.0.2"
	-DCONFIG_SPIRAM_SUPPORT
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D CONFIG_ESP_COREDUMP_ENABLE=1
	-D CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=1
	-D CONFIG_ESP_COREDUMP_CHECKSUM=1
	-D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
	-D ENABLE_LOGS
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
lib_deps = 
	https://github.com/ESP32Async/ESPAsyncWebServer.git
	https://github.com/ESP32Async/AsyncTCP.git
	bblanchon/ArduinoJson@^7.0.4
	sui77/rc-switch@^2.6.4
	arduinogetstarted/ezBuzzer@^1.0.2
	jandrassy/ArduinoOTA@^1.1.1
	ayushsharma82/ElegantOTA@^3.1.7
	arduino-libraries/NTPClient@^3.2.1
	siara-cc/Sqlite3Esp32@^2.5
	links2004/WebSockets@^2.7.3
