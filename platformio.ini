; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
build_flags = 
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-Iinclude
	-DFIRWARE_VERSION="0.0.1-ota03"
	-DENABLE_USER_AUTH
	-DENABLE_FIRESTORE
	-DENABLE_FIRESTORE_QUERY
	-DCONFIG_SPIRAM_SUPPORT
	-DENABLE_PSRAM
	-DCORE_UPDATER_OTA_UPDATER_H
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D CONFIG_ESP_COREDUMP_ENABLE=1
	-D CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=1
	-D CONFIG_ESP_COREDUMP_CHECKSUM=1
	-D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
lib_deps = 
	https://github.com/ESP32Async/ESPAsyncWebServer.git
	https://github.com/ESP32Async/AsyncTCP.git
	bblanchon/ArduinoJson@^7.0.4
	sui77/rc-switch@^2.6.4
	mobizt/FirebaseClient@^2.2.9
	bodmer/TJpg_Decoder@^1.1.0
	bodmer/TFT_eSPI@^2.5.43
	bitbank2/JPEGENC@^1.1.0
	arduinogetstarted/ezBuzzer@^1.0.2
	jandrassy/ArduinoOTA@^1.1.1
	ayushsharma82/ElegantOTA@^3.1.7
	arduino-libraries/NTPClient@^3.2.1
